<script>

const loginScreen =
    document.getElementById("login-screen");

const adminScreen =
    document.getElementById("admin-screen");

const loginError =
    document.getElementById("login-error");

const requestList =
    document.getElementById("request-list");

const searchInput =
    document.getElementById("request-search");

const filterSelect =
    document.getElementById("request-filter");

let requests = [];

let openRequestId = null;


/* -------------------------
   AUTH
------------------------- */

async function checkSession() {

    const {
        data: { session }
    } = await db.auth.getSession();

    if (session) {

        showAdmin();

    } else {

        showLogin();

    }

}


function showAdmin() {

    loginScreen.classList.add("hidden");

    adminScreen.classList.remove("hidden");

    loadRequests();

}


function showLogin() {

    adminScreen.classList.add("hidden");

    loginScreen.classList.remove("hidden");

}


document
.getElementById("login-button")
.addEventListener("click", async () => {

    loginError.textContent = "";

    const email =
        document
        .getElementById("admin-email")
        .value
        .trim();

    const password =
        document
        .getElementById("admin-password")
        .value;


    if (!email || !password) {

        loginError.textContent =
            "Please enter your email and password.";

        return;

    }


    const {
        error
    } = await db.auth.signInWithPassword({
        email,
        password
    });


    if (error) {

        loginError.textContent =
            error.message;

        return;

    }


    showAdmin();

});


document
.getElementById("logout-button")
.addEventListener("click", async () => {

    await db.auth.signOut();

    showLogin();

});


/* -------------------------
   REQUESTS
------------------------- */

async function loadRequests() {

    requestList.innerHTML =
        '<p class="empty">Loading requests...</p>';


    const {
        data,
        error
    } = await db
    .from("requests")
    .select("*")
    .order("created_at", {
        ascending: false
    });


    if (error) {

        console.error(error);

        requestList.innerHTML =
            `<p class="empty">Could not load requests: ${escapeHtml(error.message)}</p>`;

        return;

    }


    requests = data || [];

    renderRequests();

}


function renderRequests() {

    const search =
        searchInput.value
        .trim()
        .toLowerCase();

    const filter =
        filterSelect.value;


    const filtered =
        requests.filter(request => {

            const matchesSearch =
                !search ||
                String(request.request_code || "")
                    .toLowerCase()
                    .includes(search) ||
                String(request.name || "")
                    .toLowerCase()
                    .includes(search) ||
                String(request.discord || "")
                    .toLowerCase()
                    .includes(search) ||
                String(request.email || "")
                    .toLowerCase()
                    .includes(search);


            const matchesFilter =
                filter === "all" ||
                request.status === filter;


            return matchesSearch && matchesFilter;

        });


    requestList.innerHTML = "";


    if (!filtered.length) {

        requestList.innerHTML =
            '<p class="empty">No requests found.</p>';

        return;

    }


    for (const request of filtered) {

        requestList.appendChild(
            createRequestCard(request)
        );

    }

}


function createRequestCard(request) {

    const card =
        document.createElement("article");

    card.className = "request-card";

    if (openRequestId === request.id) {

        card.classList.add("open");

    }


    const summary =
        document.createElement("button");

    summary.className = "request-summary";

    summary.type = "button";


    summary.innerHTML = `
        <span class="request-code">
            ${escapeHtml(request.request_code || "No code")}
        </span>

        <span class="request-customer">
            ${escapeHtml(request.name || "Unknown customer")}
        </span>

        <span class="status">
            ${escapeHtml(request.status || "Unknown")}
        </span>

        <span class="request-date">
            ${formatDate(request.created_at)}
        </span>

        <span class="chevron">⌄</span>
    `;


    summary.addEventListener("click", () => {

        if (openRequestId === request.id) {

            openRequestId = null;

        } else {

            openRequestId = request.id;

        }

        renderRequests();

    });


    const details =
        document.createElement("div");

    details.className = "request-details";


    const detailsInner =
        document.createElement("div");

    detailsInner.className =
        "request-details-inner";


    const content =
        document.createElement("div");

    content.className = "request-content";

    content.innerHTML = `
        <div class="details-grid">

            <div class="field">
                <label>Name</label>
                <input
                    class="edit-name"
                    value="${escapeAttribute(request.name || "")}"
                >
            </div>

            <div class="field">
                <label>Discord</label>
                <input
                    class="edit-discord"
                    value="${escapeAttribute(request.discord || "")}"
                >
            </div>

            <div class="field">
                <label>Email</label>
                <input
                    class="edit-email"
                    type="email"
                    value="${escapeAttribute(request.email || "")}"
                >
            </div>

            <div class="field">
                <label>Status</label>

                <select class="edit-status">

                    ${statusOption("Pending", request.status)}

                    ${statusOption("Accepted", request.status)}

                    ${statusOption("In Progress", request.status)}

                    ${statusOption("Completed", request.status)}

                    ${statusOption("Cancelled", request.status)}

                </select>
            </div>

            <div class="field full">
                <label>Request description</label>

                <textarea class="edit-description">${escapeHtml(request.description || "")}</textarea>

```
        </div>

    </div>

    <div class="save-row">

        <button class="save-button">
            Save Request
        </button>

    </div>

    <div class="section-divider"></div>

    <h3>Customer Files</h3>

    <div class="files customer-files">
        <span class="empty">Loading files...</span>
    </div>

    <div class="section-divider"></div>

    <h3>Updates</h3>

    <div class="updates request-updates">
        <span class="empty">Loading updates...</span>
    </div>

    <div class="new-update">

        <textarea
            class="update-message"
            placeholder="Write an update for the customer..."
        ></textarea>

        <div class="update-actions">

            <label class="file-input-label">

                📎 Add files

                <input
                    class="update-files-input"
                    type="file"
                    multiple
                >

            </label>

            <button class="post-update">
                Post Update
            </button>

        </div>

    </div>
`;


detailsInner.appendChild(content);

details.appendChild(detailsInner);

card.appendChild(summary);

card.appendChild(details);


if (openRequestId === request.id) {

    setTimeout(() => {

        loadRequestFiles(
            request.id,
            content.querySelector(".customer-files")
        );

        loadUpdates(
            request.id,
            content.querySelector(".request-updates")
        );

    }, 0);

}


content
.querySelector(".save-button")
.addEventListener("click", async () => {

    await saveRequest(
        request.id,
        content
    );

});


content
.querySelector(".post-update")
.addEventListener("click", async () => {

    await postUpdate(
        request.id,
        content
    );

});


return card;
```

}

/* -------------------------
SAVE REQUEST
------------------------- */

async function saveRequest(requestId, content) {

```
const update = {

    name:
        content
        .querySelector(".edit-name")
        .value
        .trim(),

    discord:
        content
        .querySelector(".edit-discord")
        .value
        .trim(),

    email:
        content
        .querySelector(".edit-email")
        .value
        .trim(),

    status:
        content
        .querySelector(".edit-status")
        .value,

    description:
        content
        .querySelector(".edit-description")
        .value

};


const {
    error
} = await db
.from("requests")
.update(update)
.eq("id", requestId);


if (error) {

    console.error(error);

    showMessage(
        "Could not save request."
    );

    return;

}


const request =
    requests.find(
        item => item.id === requestId
    );


if (request) {

    Object.assign(request, update);

}


renderRequests();

showMessage("Request saved.");
```

}

/* -------------------------
CUSTOMER FILES
------------------------- */

async function loadRequestFiles(
requestId,
container
) {

```
const {
    data,
    error
} = await db
.from("request_images")
.select("*")
.eq("request_id", requestId);


if (error) {

    container.innerHTML =
        '<span class="empty">Could not load files.</span>';

    return;

}


container.innerHTML = "";


if (!data.length) {

    container.innerHTML =
        '<span class="empty">No files attached.</span>';

    return;

}


for (const file of data) {

    const element =
        document.createElement("div");

    element.className = "file";


    const link =
        document.createElement("a");

    link.href = file.image_url;

    link.target = "_blank";

    link.rel = "noopener";

    link.textContent = "📎 View file";


    element.appendChild(link);

    container.appendChild(element);

}
```

}

/* -------------------------
UPDATES
------------------------- */

async function loadUpdates(
requestId,
container
) {

```
const {
    data,
    error
} = await db
.from("request_updates")
.select("*")
.eq("request_id", requestId)
.order("created_at", {
    ascending: true
});


if (error) {

    container.innerHTML =
        '<span class="empty">Could not load updates.</span>';

    return;

}


container.innerHTML = "";


if (!data.length) {

    container.innerHTML =
        '<span class="empty">No updates yet.</span>';

    return;

}


for (const update of data) {

    const element =
        document.createElement("article");

    element.className = "update";


    const files =
        await loadUpdateFiles(
            update.id
        );


    let filesHtml = "";


    if (files.length) {

        filesHtml = `
            <div class="update-files">

                ${files.map(file => `
                    <a
                        href="${escapeAttribute(file.file_url)}"
                        target="_blank"
                        rel="noopener"
                    >
                        📎 ${escapeHtml(file.file_name)}
                    </a>
                `).join("")}

            </div>
        `;

    }


    element.innerHTML = `
        <div class="update-top">

            <span class="update-author">
                ${escapeHtml(update.author || "Kxko")}
            </span>

            <span class="update-date">
                ${formatDateTime(update.created_at)}
            </span>

        </div>

        <div class="update-message">
            ${escapeHtml(update.message)}
        </div>

        ${filesHtml}
    `;


    container.appendChild(element);

}
```

}

async function loadUpdateFiles(updateId) {

```
const {
    data,
    error
} = await db
.from("request_update_files")
.select("*")
.eq("update_id", updateId);


if (error) {

    console.error(error);

    return [];

}


return data || [];
```

}

POST UPDATE
------------------------- */

async function postUpdate(
requestId,
content
) {

```
const message =
    content
    .querySelector(".update-message")
    .value
    .trim();


const fileInput =
    content
    .querySelector(".update-files-input");


const files =
    Array.from(fileInput.files);


if (!message && !files.length) {

    showMessage(
        "Write a message or select a file first."
    );

    return;

}


const button =
    content
    .querySelector(".post-update");


button.disabled = true;

button.textContent = "Posting...";


const {
    data: update,
    error
} = await db
.from("request_updates")
.insert({

    request_id: requestId,

    message:
        message || "Files attached.",

    author: "Kxko"

})
.select()
.single();


if (error) {

    console.error(error);

    showMessage(
        "Could not create update."
    );

    button.disabled = false;

    button.textContent = "Post Update";

    return;

}


for (const file of files) {

    const safeName =
        file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_");


    const path =
        `request-updates/${requestId}/${update.id}-${crypto.randomUUID()}-${safeName}`;


    const upload =
        await db.storage
        .from("diagram-files")
        .upload(path, file);


    if (upload.error) {

        console.error(upload.error);

        continue;

    }


    const url =
        db.storage
        .from("diagram-files")
        .getPublicUrl(path)
        .data
        .publicUrl;


    await db
    .from("request_update_files")
    .insert({

        update_id: update.id,

        file_url: url,

        file_name: file.name

    });

}


content
.querySelector(".update-message")
.value = "";

fileInput.value = "";


await loadUpdates(
    requestId,
    content.querySelector(".request-updates")
);


button.disabled = false;

button.textContent = "Post Update";

showMessage("Update posted.");

function statusOption(
value,
current
) {

```
return `
    <option
        value="${escapeAttribute(value)}"
        ${value === current ? "selected" : ""}
    >
        ${escapeHtml(value)}
    </option>
`;
```

}

function formatDate(date) {

```
if (!date) {
    return "—";
}

return new Date(date)
    .toLocaleDateString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );
```

}

function formatDateTime(date) {

```
if (!date) {
    return "—";
}

return new Date(date)
    .toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
```

}

function escapeHtml(value) {

```
return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
```

}

function escapeAttribute(value) {

```
return escapeHtml(value);
```

}

function showMessage(message) {

```
const element =
    document.getElementById(
        "admin-message"
    );

element.textContent = message;

element.classList.add("show");


setTimeout(() => {

    element.classList.remove("show");

}, 3000);
```

}
