<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kxko Admin</title>

<link rel="icon" href="../favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f7;
    color: #182126;
    font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,.08);
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

.primary {
    background: #306778;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: bold;
}

.login-box .primary {
    width: 100%;
    margin-top: 12px;
}

#error {
    color: #b42318;
    margin-top: 12px;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #dfe5e7;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 15px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-inner h1 {
    margin: 0;
    font-size: 20px;
}

.logout {
    border: 1px solid #d5dcdf;
    background: white;
    border-radius: 8px;
    padding: 9px 13px;
}

/* MAIN */

main {
    max-width: 1200px;
    margin: auto;
    padding: 30px 22px 80px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 18px;
}

.top h2 {
    margin: 0;
    font-size: 30px;
}

.top p {
    margin: 5px 0 0;
    color: #748087;
}

.controls {
    display: flex;
    gap: 8px;
}

.controls input,
.controls select {
    padding: 10px;
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

/* REQUESTS */

#requests {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.request {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 12px;
    overflow: hidden;
}

.request.open {
    box-shadow: 0 12px 35px rgba(0,0,0,.07);
}

.request-head {
    width: 100%;
    border: 0;
    background: white;
    padding: 17px;
    display: grid;
    grid-template-columns: 1.3fr 1fr 140px 20px;
    gap: 15px;
    text-align: left;
    align-items: center;
}

.request-head:hover {
    background: #fafbfb;
}

.code {
    font-weight: bold;
}

.name {
    color: #637078;
}

.status {
    color: #306778;
    font-size: 13px;
    font-weight: bold;
}

.arrow {
    transition: transform .3s ease;
}

.request.open .arrow {
    transform: rotate(180deg);
}

/* DETAILS */

.details {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
}

.request.open .details {
    grid-template-rows: 1fr;
}

.details-inner {
    overflow: hidden;
    min-height: 0;
}

.content {
    border-top: 1px solid #e4e8ea;
    padding: 24px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font-size: 12px;
    color: #748087;
    font-weight: bold;
}

.field input,
.field textarea,
.field select {
    padding: 11px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

.field textarea {
    min-height: 130px;
    resize: vertical;
}

.save {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
}

.line {
    height: 1px;
    background: #e3e7e9;
    margin: 26px 0;
}

/* FILES */

.file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file {
    background: #f0f3f4;
    padding: 9px 12px;
    border-radius: 8px;
}

.file a {
    color: #306778;
    text-decoration: none;
}

/* UPDATES */

.update {
    background: #f2f5f6;
    padding: 14px;
    border-radius: 9px;
    margin-top: 9px;
}

.update-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
}

.author {
    font-weight: bold;
}

.date {
    color: #7b858b;
    font-size: 12px;
}

.message {
    white-space: pre-wrap;
    line-height: 1.5;
}

.update-files {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.update-files a {
    color: #306778;
}

/* NEW UPDATE */

.new-update {
    margin-top: 14px;
}

.new-update textarea {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    resize: vertical;
}

.update-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
}

.file-button {
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    padding: 10px;
}

.file-button input {
    display: none;
}

/* TOAST */

#toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 13px 17px;
    border-radius: 9px;
    background: #182126;
    color: white;
    opacity: 0;
    transform: translateY(10px);
    transition: .25s ease;
    pointer-events: none;
}

#toast.visible {
    opacity: 1;
    transform: translateY(0);
}

.empty {
    color: #7a858b;
}

@media(max-width: 750px) {

    .top {
        display: block;
    }

    .controls {
        margin-top: 15px;
        flex-direction: column;
    }

    .request-head {
        grid-template-columns: 1fr 20px;
    }

    .name,
    .status {
        display: none;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

}

</style>

</head>

<script>


var allRequests = [];

var openRequest = null;


/* LOGIN */


function showApp() {

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    loadRequests();

}


function showLogin() {

    document
        .getElementById("login")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");

}


document
    .getElementById("login-button")
    .onclick = async function() {

        var email =
            document
                .getElementById("email")
                .value
                .trim();

        var password =
            document
                .getElementById("password")
                .value;

        var error =
            document
                .getElementById("error");

        error.textContent = "";


        var result =
            await db.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (result.error) {

            error.textContent =
                result.error.message;

            return;

        }


        showApp();

    };


document
    .getElementById("logout")
    .onclick = async function() {

        await db.auth.signOut();

        showLogin();

    };


async function checkSession() {

    var result =
        await db.auth.getSession();

    if (result.data.session) {

        showApp();

    } else {

        showLogin();

    }

}


/* LOAD REQUESTS */


async function loadRequests() {

    var container =
        document.getElementById("requests");

    container.innerHTML =
        '<p class="empty">Loading requests...</p>';


    var result =
        await db
            .from("requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (result.error) {

        container.innerHTML =
            '<p class="empty">Error: ' +
            clean(result.error.message) +
            '</p>';

        return;

    }


    allRequests =
        result.data || [];

    drawRequests();

}


/* DRAW REQUESTS */


function drawRequests() {

    var container =
        document.getElementById("requests");

    var search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    var filter =
        document
            .getElementById("filter")
            .value;


    container.innerHTML = "";


    for (
        var i = 0;
        i < allRequests.length;
        i++
    ) {

        var request =
            allRequests[i];


        var searchable =
            (
                (request.request_code || "") +
                " " +
                (request.name || "") +
                " " +
                (request.discord || "") +
                " " +
                (request.email || "")
            ).toLowerCase();


        if (
            search &&
            searchable.indexOf(search) === -1
        ) {
            continue;
        }


        if (
            filter !== "all" &&
            request.status !== filter
        ) {
            continue;
        }


        container.appendChild(
            makeRequest(request)
        );

    }


    if (!container.children.length) {

        container.innerHTML =
            '<p class="empty">No requests found.</p>';

    }

}


/* REQUEST */


function makeRequest(request) {

    var article =
        document.createElement("article");

    article.className =
        "request";


    if (
        openRequest === request.id
    ) {

        article.classList.add("open");

    }


    var head =
        document.createElement("button");

    head.className =
        "request-head";

    head.type =
        "button";


    head.innerHTML =
        '<span class="code">' +
        clean(request.request_code || "No code") +
        '</span>' +

        '<span class="name">' +
        clean(request.name || "Unknown") +
        '</span>' +

        '<span class="status">' +
        clean(request.status || "Pending") +
        '</span>' +

        '<span class="arrow">⌄</span>';


    head.onclick =
        function() {

            if (
                openRequest === request.id
            ) {

                openRequest = null;

            } else {

                openRequest = request.id;

            }

            drawRequests();

        };


    var details =
        document.createElement("div");

    details.className =
        "details";


    var inner =
        document.createElement("div");

    inner.className =
        "details-inner";


    var content =
        document.createElement("div");

    content.className =
        "content";


    content.innerHTML =

        '<div class="grid">' +

        '<div class="field">' +
        '<label>Name</label>' +
        '<input class="edit-name">' +
        '</div>' +

        '<div class="field">' +
        '<label>Discord</label>' +
        '<input class="edit-discord">' +
        '</div>' +

        '<div class="field">' +
        '<label>Email</label>' +
        '<input class="edit-email">' +
        '</div>' +

        '<div class="field">' +
        '<label>Status</label>' +
        '<select class="edit-status">' +
        '<option>Pending</option>' +
        '<option>Accepted</option>' +
        '<option>In Progress</option>' +
        '<option>Completed</option>' +
        '<option>Cancelled</option>' +
        '</select>' +
        '</div>' +

        '<div class="field full">' +
        '<label>Description</label>' +
        '<textarea class="edit-description"></textarea>' +

```
    '</div>' +

    '</div>' +

    '<div class="save">' +
    '<button class="primary save-button">' +
    'Save Changes' +
    '</button>' +
    '</div>' +

    '<div class="line"></div>' +

    '<h3>Customer Files</h3>' +

    '<div class="file-list customer-files">' +
    '<span class="empty">Loading...</span>' +
    '</div>' +

    '<div class="line"></div>' +

    '<h3>Updates</h3>' +

    '<div class="update-list">' +
    '<span class="empty">Loading...</span>' +
    '</div>' +

    '<div class="new-update">' +

    '<textarea ' +
    'class="new-message" ' +
    'placeholder="Write an update for the customer..."' +
    '></textarea>' +

    '<div class="update-bottom">' +

    '<label class="file-button">' +
    '📎 Add files' +
    '<input class="new-files" type="file" multiple>' +
    '</label>' +

    '<button class="primary post-button">' +
    'Post Update' +
    '</button>' +

    '</div>' +

    '</div>';


content
    .querySelector(".edit-name")
    .value =
    request.name || "";


content
    .querySelector(".edit-discord")
    .value =
    request.discord || "";


content
    .querySelector(".edit-email")
    .value =
    request.email || "";


content
    .querySelector(".edit-description")
    .value =
    request.description || "";


content
    .querySelector(".edit-status")
    .value =
    request.status || "Pending";


content
    .querySelector(".save-button")
    .onclick =
    function() {

        saveRequest(
            request.id,
            content
        );

    };


content
    .querySelector(".post-button")
    .onclick =
    function() {

        postUpdate(
            request.id,
            content
        );

    };


inner.appendChild(content);

details.appendChild(inner);

article.appendChild(head);

article.appendChild(details);


if (
    openRequest === request.id
) {

    loadFiles(
        request.id,
        content.querySelector(
            ".customer-files"
        )
    );


    loadUpdates(
        request.id,
        content.querySelector(
            ".update-list"
        )
    );

}


return article;
```

}

/* SAVE REQUEST */

async function saveRequest(
id,
content
) {

```
var data = {

    name:
        content
            .querySelector(".edit-name")
            .value
            .trim(),

    discord:
        content
            .querySelector(".edit-discord")
            .value
            .trim(),

    email:
        content
            .querySelector(".edit-email")
            .value
            .trim(),

    status:
        content
            .querySelector(".edit-status")
            .value,

    description:
        content
            .querySelector(".edit-description")
            .value

};


var result =
    await db
        .from("requests")
        .update(data)
        .eq("id", id);


if (result.error) {

    console.error(result.error);

    toast(
        "Could not save request."
    );

    return;

}


for (
    var i = 0;
    i < allRequests.length;
    i++
) {

    if (
        allRequests[i].id === id
    ) {

        Object.assign(
            allRequests[i],
            data
        );

    }

}


drawRequests();

toast("Request saved.");
```

}

/* CUSTOMER FILES */

async function loadFiles(
requestId,
container
) {

```
var result =
    await db
        .from("request_images")
        .select("*")
        .eq(
            "request_id",
            requestId
        );


container.innerHTML = "";


if (result.error) {

    container.innerHTML =
        '<span class="empty">Could not load files.</span>';

    return;

}


if (!result.data.length) {

    container.innerHTML =
        '<span class="empty">No files.</span>';

    return;

}


for (
    var i = 0;
    i < result.data.length;
    i++
) {

    var file =
        result.data[i];


    var div =
        document.createElement("div");

    div.className =
        "file";


    var link =
        document.createElement("a");

    link.href =
        file.image_url;

    link.target =
        "_blank";

    link.rel =
        "noopener";

    link.textContent =
        "📎 View file";


    div.appendChild(link);

    container.appendChild(div);

}
```

}

/* UPDATES */

async function loadUpdates(
requestId,
container
) {

```
var result =
    await db
        .from("request_updates")
        .select("*")
        .eq(
            "request_id",
            requestId
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


container.innerHTML = "";


if (result.error) {

    container.innerHTML =
        '<span class="empty">Could not load updates.</span>';

    return;

}


if (!result.data.length) {

    container.innerHTML =
        '<span class="empty">No updates yet.</span>';

    return;

}


for (
    var i = 0;
    i < result.data.length;
    i++
) {

    await addUpdate(
        result.data[i],
        container
    );

}
```

}

async function addUpdate(
update,
container
) {

```
var div =
    document.createElement("div");

div.className =
    "update";


var filesResult =
    await db
        .from("request_update_files")
        .select("*")
        .eq(
            "update_id",
            update.id
        );


var fileHTML =
    "";


if (
    !filesResult.error &&
    filesResult.data.length
) {

    fileHTML =
        '<div class="update-files">';


    for (
        var i = 0;
        i < filesResult.data.length;
        i++
    ) {

        var file =
            filesResult.data[i];


        fileHTML +=
            '<a href="' +
            attribute(file.file_url) +
            '" target="_blank" rel="noopener">' +
            '📎 ' +
            clean(file.file_name) +
            '</a>';

    }


    fileHTML +=
        '</div>';

}


div.innerHTML =

    '<div class="update-header">' +

    '<span class="author">' +
    clean(update.author || "Kxko") +
    '</span>' +

    '<span class="date">' +
    dateTime(update.created_at) +
    '</span>' +

    '</div>' +

    '<div class="message">' +
    clean(update.message || "") +
    '</div>' +

    fileHTML;


container.appendChild(div);
```

}

/* POST UPDATE */

async function postUpdate(
requestId,
content
) {

```
var message =
    content
        .querySelector(".new-message")
        .value
        .trim();


var input =
    content.querySelector(".new-files");


var files =
    input.files;


if (
    !message &&
    files.length === 0
) {

    toast(
        "Write a message or attach a file."
    );

    return;

}


var button =
    content.querySelector(
        ".post-button"
    );


button.disabled =
    true;

button.textContent =
    "Posting...";


var result =
    await db
        .from("request_updates")
        .insert({

            request_id:
                requestId,

            message:
                message || "Files attached.",

            author:
                "Kxko"

        })
        .select()
        .single();


if (result.error) {

    console.error(result.error);

    toast(
        "Could not create update."
    );

    button.disabled =
        false;

    button.textContent =
        "Post Update";

    return;

}


var update =
    result.data;


for (
    var i = 0;
    i < files.length;
    i++
) {

    var file =
        files[i];


    var safe =
        file.name
            .split(" ")
            .join("_");


    var path =
        "request-updates/" +
        requestId +
        "/" +
        update.id +
        "-" +
        Date.now() +
        "-" +
        safe;


    var upload =
        await db.storage
            .from("diagram-files")
            .upload(
                path,
                file
            );


    if (upload.error) {

        console.error(
            upload.error
        );

        continue;

    }


    var publicURL =
        db.storage
            .from("diagram-files")
            .getPublicUrl(
                path
            )
            .data
            .publicUrl;


    await db
        .from("request_update_files")
        .insert({

            update_id:
                update.id,

            file_url:
                publicURL,

            file_name:
                file.name

        });

}


content
    .querySelector(".new-message")
    .value = "";


input.value = "";


await loadUpdates(
    requestId,
    content.querySelector(
        ".update-list"
    )
);


button.disabled =
    false;

button.textContent =
    "Post Update";


toast(
    "Update posted."
);
```

}

/* HELPERS */

function clean(value) {

```
var text =
    String(value);


text =
    text.split("&").join("&amp;");

text =
    text.split("<").join("&lt;");

text =
    text.split(">").join("&gt;");

text =
    text.split('"').join("&quot;");

text =
    text.split("'").join("&#039;");


return text;
```

}

function attribute(value) {

```

function dateTime(value) {

```
if (!value) {
    return "";
}


return new Date(value)
    .toLocaleString();
```

}

function toast(message) {

```
var element =
    document.getElementById("toast");


element.textContent =
    message;


element.classList.add(
    "visible"
);


setTimeout(
    function() {

        element.classList.remove(
            "visible"
        );

    },
    3000
);
```

}
