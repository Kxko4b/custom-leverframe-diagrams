<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kxko Admin</title>
<link rel="icon" href="../favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f7;
    color: #182126;
    font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

.primary {
    background: #306778;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: bold;
}

.login-box .primary {
    width: 100%;
    margin-top: 12px;
}

#error {
    color: #b42318;
    margin-top: 12px;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #dfe5e7;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-inner h1 {
    margin: 0;
    font-size: 20px;
}

.logout {
    border: 1px solid #d5dcdf;
    background: white;
    border-radius: 8px;
    padding: 9px 13px;
}

/* MAIN */

main {
    max-width: 1200px;
    margin: auto;
    padding: 30px 22px 80px;
}

.top {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
}

.top h2 {
    margin: 0;
    font-size: 30px;
}

.top p {
    margin: 5px 0 0;
    color: #748087;
}

.controls {
    display: flex;
    gap: 8px;
}

.controls input,
.controls select {
    padding: 10px;
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

/* REQUEST LIST */

#requests {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.request {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.25s ease;
}

.request.open {
    box-shadow: 0 12px 35px rgba(0,0,0,0.08);
}

.request-head {
    width: 100%;
    border: 0;
    background: white;
    padding: 17px;
    display: grid;
    grid-template-columns: 1.2fr 1fr 150px 20px;
    gap: 15px;
    align-items: center;
    text-align: left;
}

.request-head:hover {
    background: #fafbfb;
}

.code {
    font-weight: bold;
}

.name {
    color: #68747b;
}

.status {
    color: #306778;
    font-weight: bold;
    font-size: 13px;
}

.arrow {
    transition: transform 0.3s ease;
}

.request.open .arrow {
    transform: rotate(180deg);
}

/* SMOOTH EXPANSION */

.details {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s ease;
}

.request.open .details {
    grid-template-rows: 1fr;
}

.details-inner {
    overflow: hidden;
    min-height: 0;
}

.content {
    padding: 24px;
    border-top: 1px solid #e4e8ea;
}

/* FORM */

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font-size: 12px;
    color: #748087;
    font-weight: bold;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    background: white;
}

.field textarea {
    min-height: 140px;
    resize: vertical;
}

.save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
}

.divider {
    height: 1px;
    background: #e3e7e9;
    margin: 26px 0;
}

/* FILES */

.file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file {
    background: #f0f3f4;
    padding: 9px 12px;
    border-radius: 8px;
}

.file a {
    color: #306778;
    text-decoration: none;
}

/* UPDATES */

.update {
    background: #f2f5f6;
    padding: 14px;
    border-radius: 9px;
    margin-top: 9px;
}

.update-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}

.author {
    font-weight: bold;
}

.date {
    color: #7b858b;
    font-size: 12px;
}

.message {
    white-space: pre-wrap;
    line-height: 1.5;
}

.update-files {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.update-files a {
    color: #306778;
}

/* NEW UPDATE */

.new-update {
    margin-top: 14px;
}

.new-message {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    resize: vertical;
}

.update-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
}

.file-button {
    display: inline-block;
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    padding: 10px;
}

.file-button input {
    display: none;
}

/* TOAST */

#toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 13px 17px;
    border-radius: 9px;
    background: #182126;
    color: white;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
}

#toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* MOBILE */

@media (max-width: 750px) {

    .top {
        display: block;
    }

    .controls {
        margin-top: 15px;
        flex-direction: column;
    }

    .request-head {
        grid-template-columns: 1fr 20px;
    }

    .name,
    .status {
        display: none;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .update-actions {
        align-items: stretch;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div id="login">
    <div class="login-box">

        <h1>Kxko Admin</h1>

        <p>Sign in to manage requests.</p>

        <input
            id="admin-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="admin-password"
            type="password"
            placeholder="Password"
        >

        <button
            id="login-button"
            class="primary"
        >
            Sign In
        </button>

        <div id="error"></div>

    </div>
</div>


<div id="app" class="hidden">

    <header>

        <div class="header-inner">

            <h1>Kxko Admin</h1>

            <button
                id="logout-button"
                class="logout"
            >
                Log out
            </button>

        </div>

    </header>


    <main>

        <div class="top">

            <div>
                <h2>Requests</h2>
                <p>
                    Manage customer requests, files and updates.
                </p>
            </div>

            <div class="controls">

                <input
                    id="search"
                    type="text"
                    placeholder="Search..."
                >

                <select id="filter">

                    <option value="all">
                        All statuses
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Accepted">
                        Accepted
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <div id="requests"></div>

    </main>

</div>


<div id="toast"></div>


<script>

var allRequests = [];
var openedRequestId = null;


/* LOGIN */

async function start() {

    var result = await db.auth.getSession();

    if (result.error) {
        showLogin();
        return;
    }

    if (result.data.session) {
        showApp();
    } else {
        showLogin();
    }
}


function showLogin() {

    document
        .getElementById("login")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");
}


function showApp() {

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    loadRequests();
}


document
    .getElementById("login-button")
    .addEventListener("click", login);


async function login() {

    var email =
        document
            .getElementById("admin-email")
            .value
            .trim();

    var password =
        document
            .getElementById("admin-password")
            .value;

    var error =
        document
            .getElementById("error");

    error.textContent = "";

    if (!email || !password) {

        error.textContent =
            "Please enter your email and password.";

        return;
    }

    var result =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (result.error) {

        error.textContent =
            result.error.message;

        return;
    }

    showApp();
}


document
    .getElementById("logout-button")
    .addEventListener(
        "click",
        async function() {

            await db.auth.signOut();

            openedRequestId = null;

            showLogin();
        }
    );


/* REQUESTS */

async function loadRequests() {

    var container =
        document.getElementById("requests");

    container.innerHTML =
        "<p>Loading requests...</p>";

    var result =
        await db
            .from("requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (result.error) {

        container.innerHTML =
            "<p>Could not load requests: " +
            escapeHtml(result.error.message) +
            "</p>";

        return;
    }

    allRequests =
        result.data || [];

    renderRequests();
}


function renderRequests() {

    var container =
        document.getElementById("requests");

    var search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    var filter =
        document
            .getElementById("filter")
            .value;

    container.innerHTML = "";

    var visible = [];

    for (
        var i = 0;
        i < allRequests.length;
        i++
    ) {

        var request =
            allRequests[i];

        var searchable =
            (
                String(request.request_code || "") +
                " " +
                String(request.name || "") +
                " " +
                String(request.email || "") +
                " " +
                String(request.discord || "")
            ).toLowerCase();

        if (
            search &&
            searchable.indexOf(search) === -1
        ) {
            continue;
        }

        if (
            filter !== "all" &&
            request.status !== filter
        ) {
            continue;
        }

        visible.push(request);
    }

    if (visible.length === 0) {

        container.innerHTML =
            "<p>No requests found.</p>";

        return;
    }

    for (
        var j = 0;
        j < visible.length;
        j++
    ) {

        container.appendChild(
            createRequestCard(
                visible[j]
            )
        );
    }
}


function createRequestCard(request) {

    var card =
        document.createElement("article");

    card.className = "request";

    if (
        openedRequestId === request.id
    ) {
        card.classList.add("open");
    }


    /* HEADER */

    var header =
        document.createElement("button");

    header.type = "button";
    header.className = "request-head";

    header.innerHTML =
        "<span class='code'>" +
        escapeHtml(
            request.request_code ||
            "No code"
        ) +
        "</span>" +

        "<span class='name'>" +
        escapeHtml(
            request.name ||
            "Unknown"
        ) +
        "</span>" +

        "<span class='status'>" +
        escapeHtml(
            request.status ||
            "Pending"
        ) +
        "</span>" +

        "<span class='arrow'>⌄</span>";


    header.addEventListener(
        "click",
        function() {

            if (
                openedRequestId === request.id
            ) {

                openedRequestId = null;

            } else {

                openedRequestId = request.id;
            }

            renderRequests();
        }
    );


    /* DETAILS */

    var details =
        document.createElement("div");

    details.className = "details";


    var detailsInner =
        document.createElement("div");

    detailsInner.className =
        "details-inner";


    var content =
        document.createElement("div");

    content.className = "content";


    content.innerHTML =

        "<div class='grid'>" +

        "<div class='field'>" +
        "<label>Name</label>" +
        "<input class='edit-name'>" +
        "</div>" +

        "<div class='field'>" +
        "<label>Discord</label>" +
        "<input class='edit-discord'>" +
        "</div>" +

        "<div class='field'>" +
        "<label>Email</label>" +
        "<input class='edit-email'>" +
        "</div>" +

        "<div class='field'>" +
        "<label>Status</label>" +

        "<select class='edit-status'>" +
        "<option value='Pending'>Pending</option>" +
        "<option value='Accepted'>Accepted</option>" +
        "<option value='In Progress'>In Progress</option>" +
        "<option value='Completed'>Completed</option>" +
        "<option value='Cancelled'>Cancelled</option>" +
        "</select>" +

        "</div>" +

        "<div class='field'>" +
        "<label>Size</label>" +
        "<input class='edit-size'>" +
        "</div>" +

        "<div class='field'>" +
        "<label>Type</label>" +
        "<input class='edit-type'>" +
        "</div>" +

        "<div class='field full'>" +
        "<label>Description</label>" +
        "<textarea class='edit-description'></textarea>" +
        "</div>" +

        "</div>" +

        "<div class='save-row'>" +
        "<button class='primary save-button'>" +
        "Save Changes" +
        "</button>" +
        "</div>" +

        "<div class='divider'></div>" +

        "<h3>Customer Files</h3>" +

        "<div class='file-list customer-files'>" +
        "<span>Loading...</span>" +
        "</div>" +

        "<div class='divider'></div>" +

        "<h3>Updates</h3>" +

        "<div class='update-list'>" +
        "<span>Loading...</span>" +
        "</div>" +

        "<div class='new-update'>" +

        "<textarea " +
        "class='new-message' " +
        "placeholder='Write an update for the customer...'>" +
        "</textarea>" +

        "<div class='update-actions'>" +

        "<label class='file-button'>" +
        "📎 Add files" +
        "<input " +
        "class='new-files' " +
        "type='file' " +
        "multiple>" +
        "</label>" +

        "<button class='primary post-button'>" +
        "Post Update" +
        "</button>" +

        "</div>" +

        "</div>";


    content
        .querySelector(".edit-name")
        .value =
        request.name || "";


    content
        .querySelector(".edit-discord")
        .value =
        request.discord || "";


    content
        .querySelector(".edit-email")
        .value =
        request.email || "";


    content
        .querySelector(".edit-status")
        .value =
        request.status || "Pending";


    content
        .querySelector(".edit-size")
        .value =
        request.size || "";


    content
        .querySelector(".edit-type")
        .value =
        request.type || "";


    content
        .querySelector(".edit-description")
        .value =
        request.description || "";


    content
        .querySelector(".save-button")
        .addEventListener(
            "click",
            function() {

                saveRequest(
                    request.id,
                    content
                );
            }
        );


    content
        .querySelector(".post-button")
        .addEventListener(
            "click",
            function() {

                postUpdate(
                    request.id,
                    content
                );
            }
        );


    detailsInner.appendChild(content);
    details.appendChild(detailsInner);

    card.appendChild(header);
    card.appendChild(details);


    if (
        openedRequestId === request.id
    ) {

        loadFiles(
            request.id,
            content.querySelector(
                ".customer-files"
            )
        );

        loadUpdates(
            request.id,
            content.querySelector(
                ".update-list"
            )
        );
    }


    return card;
}


/* SAVE */

async function saveRequest(
    requestId,
    content
) {

    var button =
        content.querySelector(
            ".save-button"
        );

    button.disabled = true;
    button.textContent = "Saving...";


    var data = {

        name:
            content
                .querySelector(".edit-name")
                .value
                .trim(),

        discord:
            content
                .querySelector(".edit-discord")
                .value
                .trim(),

        email:
            content
                .querySelector(".edit-email")
                .value
                .trim(),

        status:
            content
                .querySelector(".edit-status")
                .value,

        size:
            content
                .querySelector(".edit-size")
                .value
                .trim(),

        type:
            content
                .querySelector(".edit-type")
                .value
                .trim(),

        description:
            content
                .querySelector(".edit-description")
                .value
    };


    var result =
        await db
            .from("requests")
            .update(data)
            .eq(
                "id",
                requestId
            );


    button.disabled = false;
    button.textContent = "Save Changes";


    if (result.error) {

        console.error(result.error);

        toast(
            "Could not save request."
        );

        return;
    }


    for (
        var i = 0;
        i < allRequests.length;
        i++
    ) {

        if (
            allRequests[i].id === requestId
        ) {

            Object.assign(
                allRequests[i],
                data
            );
        }
    }


    renderRequests();

    toast(
        "Request saved."
    );
}


/* CUSTOMER FILES */

async function loadFiles(
    requestId,
    container
) {

    var result =
        await db
            .from("request_images")
            .select("*")
            .eq(
                "request_id",
                requestId
            );


    container.innerHTML = "";


    if (result.error) {

        container.innerHTML =
            "<span>Could not load files.</span>";

        console.error(result.error);

        return;
    }


    if (
        !result.data ||
        result.data.length === 0
    ) {

        container.innerHTML =
            "<span>No files.</span>";

        return;
    }


    for (
        var i = 0;
        i < result.data.length;
        i++
    ) {

        var item =
            result.data[i];

        var wrapper =
            document.createElement("div");

        wrapper.className = "file";


        var link =
            document.createElement("a");

        link.href =
            item.image_url;

        link.target = "_blank";
        link.rel = "noopener";

        link.textContent =
            "📎 View file";


        wrapper.appendChild(link);

        container.appendChild(wrapper);
    }
}


/* UPDATES */

async function loadUpdates(
    requestId,
    container
) {

    var result =
        await db
            .from("request_updates")
            .select("*")
            .eq(
                "request_id",
                requestId
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    container.innerHTML = "";


    if (result.error) {

        container.innerHTML =
            "<span>Could not load updates.</span>";

        console.error(result.error);

        return;
    }


    if (
        !result.data ||
        result.data.length === 0
    ) {

        container.innerHTML =
            "<span>No updates yet.</span>";

        return;
    }


    for (
        var i = 0;
        i < result.data.length;
        i++
    ) {

        await renderUpdate(
            result.data[i],
            container
        );
    }
}


async function renderUpdate(
    update,
    container
) {

    var box =
        document.createElement("div");

    box.className = "update";


    var header =
        document.createElement("div");

    header.className =
        "update-header";


    var author =
        document.createElement("span");

    author.className = "author";

    author.textContent =
        update.author || "Kxko";


    var date =
        document.createElement("span");

    date.className = "date";

    date.textContent =
        formatDate(
            update.created_at
        );


    header.appendChild(author);
    header.appendChild(date);


    var message =
        document.createElement("div");

    message.className = "message";

    message.textContent =
        update.message || "";


    box.appendChild(header);
    box.appendChild(message);


    var fileResult =
        await db
            .from("request_update_files")
            .select("*")
            .eq(
                "update_id",
                update.id
            );


    if (
        !fileResult.error &&
        fileResult.data &&
        fileResult.data.length > 0
    ) {

        var files =
            document.createElement("div");

        files.className =
            "update-files";


        for (
            var i = 0;
            i < fileResult.data.length;
            i++
        ) {

            var file =
                fileResult.data[i];

            var link =
                document.createElement("a");

            link.href =
                file.file_url;

            link.target = "_blank";
            link.rel = "noopener";

            link.textContent =
                "📎 " +
                (
                    file.file_name ||
                    "Attached file"
                );

            files.appendChild(link);
        }


        box.appendChild(files);
    }


    container.appendChild(box);
}


/* POST UPDATE */

async function postUpdate(
    requestId,
    content
) {

    var message =
        content
            .querySelector(".new-message")
            .value
            .trim();


    var fileInput =
        content.querySelector(
            ".new-files"
        );


    var files =
        fileInput.files;


    if (
        !message &&
        files.length === 0
    ) {

        toast(
            "Write a message or add a file."
        );

        return;
    }


    var button =
        content.querySelector(
            ".post-button"
        );


    button.disabled = true;
    button.textContent = "Posting...";


    var result =
        await db
            .from("request_updates")
            .insert({

                request_id:
                    requestId,

                message:
                    message ||
                    "Files attached.",

                author:
                    "Kxko"

            })
            .select()
            .single();


    if (result.error) {

        console.error(result.error);

        button.disabled = false;
        button.textContent = "Post Update";

        toast(
            "Could not create update."
        );

        return;
    }


    var update =
        result.data;


    for (
        var i = 0;
        i < files.length;
        i++
    ) {

        var file =
            files[i];


        var cleanName =
            file.name
                .replace(/[^a-zA-Z0-9._-]/g, "_");


        var path =
            "request-updates/" +
            requestId +
            "/" +
            update.id +
            "-" +
            Date.now() +
            "-" +
            cleanName;


        var upload =
            await db.storage
                .from("diagram-files")
                .upload(
                    path,
                    file
                );


        if (upload.error) {

            console.error(
                upload.error
            );

            continue;
        }


        var publicUrl =
            db.storage
                .from("diagram-files")
                .getPublicUrl(
                    path
                )
                .data
                .publicUrl;


        var fileInsert =
            await db
                .from("request_update_files")
                .insert({

                    update_id:
                        update.id,

                    file_url:
                        publicUrl,

                    file_name:
                        file.name

                });


        if (fileInsert.error) {

            console.error(
                fileInsert.error
            );
        }
    }


    content
        .querySelector(
            ".new-message"
        )
        .value = "";


    fileInput.value = "";


    await loadUpdates(
        requestId,
        content.querySelector(
            ".update-list"
        )
    );


    button.disabled = false;
    button.textContent = "Post Update";


    toast(
        "Update posted."
    );
}

    .addEventListener(
        "input",
        renderRequests
    );


document
    .getElementById("filter")
    .addEventListener(
        "change",

/* HELPERS */

function escapeHtml(value) {

    var text =
        String(value);

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {

    if (!value) {
        return "";
    }

    return new Date(value)
        .toLocaleString();
}


function toast(message) {

    var element =
        document.getElementById("toast");

    element.textContent =
        message;

    element.classList.add("show");

    setTimeout(
        function() {

            element.classList.remove(
                "show"
            );

        },
        3000
    );
}
