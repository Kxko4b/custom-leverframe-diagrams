<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kxko Admin</title>

<link rel="icon" type="image/png" href="../favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7f8;
    color: #182126;
    font-family: Inter, Arial, sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,.07);
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: 1px solid #d5dce0;
    border-radius: 9px;
}

.login-box button {
    width: 100%;
    margin-top: 14px;
}

#login-error {
    color: #b42318;
    margin-top: 12px;
}

/* GENERAL */

.primary {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    background: #306778;
    color: white;
    font-weight: 700;
}

header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: white;
    border-bottom: 1px solid #e1e6e8;
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-inner h1 {
    margin: 0;
    font-size: 21px;
}

.logout {
    border: 1px solid #d5dce0;
    background: white;
    border-radius: 8px;
    padding: 9px 13px;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 30px 24px 80px;
}

/* REQUEST HEADER */

.requests-heading {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 18px;
}

.requests-heading h2 {
    margin: 0;
    font-size: 31px;
}

.requests-heading p {
    color: #737e84;
    margin: 5px 0 0;
}

.controls {
    display: flex;
    gap: 9px;
}

.controls input,
.controls select {
    border: 1px solid #d5dce0;
    background: white;
    border-radius: 9px;
    padding: 10px 12px;
}

/* REQUEST CARD */

.request-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.request-card {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 13px;
    overflow: hidden;
    transition: box-shadow .25s ease, border-color .25s ease;
}

.request-card.open {
    border-color: #b8cdd4;
    box-shadow: 0 12px 35px rgba(0,0,0,.07);
}

.request-header {
    width: 100%;
    padding: 17px 19px;
    border: 0;
    background: white;
    display: grid;
    grid-template-columns: 1.2fr 1fr 140px 110px 20px;
    align-items: center;
    gap: 15px;
    text-align: left;
}

.request-header:hover {
    background: #fafbfb;
}

.request-code {
    font-weight: 800;
}

.request-name {
    color: #59656b;
}

.request-date {
    color: #7d878c;
    font-size: 13px;
}

.status {
    width: fit-content;
    padding: 6px 10px;
    border-radius: 999px;
    background: #edf3f5;
    color: #306778;
    font-size: 13px;
    font-weight: 750;
}

.arrow {
    color: #7a858b;
    transition: transform .3s ease;
}

.request-card.open .arrow {
    transform: rotate(180deg);
}

/* EXPAND */

.request-details {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .35s ease;
}

.request-card.open .request-details {
    grid-template-rows: 1fr;
}

.request-details-inner {
    overflow: hidden;
    min-height: 0;
}

.request-content {
    border-top: 1px solid #e5e9eb;
    padding: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 17px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    color: #747f85;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border: 1px solid #d5dce0;
    border-radius: 9px;
    padding: 11px 12px;
    background: white;
}

.field textarea {
    min-height: 140px;
    resize: vertical;
}

.save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 13px;
}

.divider {
    height: 1px;
    background: #e4e8ea;
    margin: 27px 0;
}

h3 {
    margin-top: 0;
}

/* FILES */

.files {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file {
    background: #f1f4f5;
    padding: 9px 12px;
    border-radius: 8px;
}

.file a {
    color: #306778;
    text-decoration: none;
    font-weight: 650;
}

/* UPDATES */

.updates {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.update {
    background: #f5f7f8;
    border-radius: 10px;
    padding: 15px;
}

.update-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

.update-author {
    font-weight: 800;
}

.update-date {
    color: #7c878d;
    font-size: 12px;
}

.update-message {
    white-space: pre-wrap;
    line-height: 1.5;
}

.update-files {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.update-files a {
    color: #306778;
}

/* NEW UPDATE */

.new-update {
    margin-top: 15px;
}

.new-update textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: 1px solid #d5dce0;
    border-radius: 9px;
    padding: 12px;
}

.update-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 9px;
    gap: 10px;
}

.file-picker {
    border: 1px solid #d5dce0;
    background: white;
    border-radius: 8px;
    padding: 10px 13px;
    cursor: pointer;
}

.file-picker input {
    display: none;
}

/* EXAMPLES */

.examples {
    margin-top: 55px;
    padding-top: 35px;
    border-top: 1px solid #dfe5e7;
}

.example-form {
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.example-form input {
    padding: 12px;
    border: 1px solid #d5dce0;
    border-radius: 9px;
}

/* MESSAGE */

#toast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    background: #182126;
    color: white;
    padding: 13px 17px;
    border-radius: 9px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: .25s ease;
}

#toast.show {
    opacity: 1;
    transform: translateY(0);
}

.empty {
    color: #7b858b;
}

@media (max-width: 800px) {

    .request-header {
        grid-template-columns: 1fr 1fr 20px;
    }

    .request-header .request-date,
    .request-header .status {
        display: none;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .requests-heading {
        flex-direction: column;
        align-items: stretch;
    }

    .controls {
        flex-direction: column;
    }
}
</style>

</head>

<script>

let requests = [];
let openedRequest = null;


/* -------------------------
   AUTH
------------------------- */

async function checkLogin() {

    const result =
        await db.auth.getSession();

    if (result.data.session) {

        showAdmin();

    } else {

        showLogin();

    }

}


function showLogin() {

    document
        .getElementById("login-screen")
        .classList.remove("hidden");

    document
        .getElementById("admin-screen")
        .classList.add("hidden");

}


function showAdmin() {

    document
        .getElementById("login-screen")
        .classList.add("hidden");

    document
        .getElementById("admin-screen")
        .classList.remove("hidden");

    loadRequests();

}


document
    .getElementById("login-button")
    .addEventListener("click", async function() {

        const email =
            document
                .getElementById("admin-email")
                .value
                .trim();

        const password =
            document
                .getElementById("admin-password")
                .value;

        const errorBox =
            document
                .getElementById("login-error");

        errorBox.textContent = "";

        if (!email || !password) {

            errorBox.textContent =
                "Enter your email and password.";

            return;

        }

        const result =
            await db.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (result.error) {

            console.error(result.error);

            errorBox.textContent =
                result.error.message;

            return;

        }

        showAdmin();

    });


document
    .getElementById("logout-button")
    .addEventListener("click", async function() {

        await db.auth.signOut();

        showLogin();

    });


/* -------------------------
   LOAD REQUESTS
------------------------- */

async function loadRequests() {

    const list =
        document.getElementById("request-list");

    list.innerHTML =
        '<p class="empty">Loading requests...</p>';

    const result =
        await db
            .from("requests")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    if (result.error) {

        console.error(result.error);

        list.innerHTML =
            '<p class="empty">Could not load requests: '
            + escapeHtml(result.error.message)
            + '</p>';

        return;

    }

    requests =
        result.data || [];

    renderRequests();

}


/* -------------------------
   RENDER REQUESTS
------------------------- */

function renderRequests() {

    const list =
        document.getElementById("request-list");

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const filter =
        document
            .getElementById("filter")
            .value;

    list.innerHTML = "";

    const filtered =
        requests.filter(function(request) {

            const text =
                (
                    (request.request_code || "") +
                    " " +
                    (request.name || "") +
                    " " +
                    (request.discord || "") +
                    " " +
                    (request.email || "")
                ).toLowerCase();

            const matchesSearch =
                !search ||
                text.includes(search);

            const matchesFilter =
                filter === "all" ||
                request.status === filter;

            return matchesSearch &&
                   matchesFilter;

        });


    if (!filtered.length) {

        list.innerHTML =
            '<p class="empty">No requests found.</p>';

        return;

    }


    filtered.forEach(function(request) {

        list.appendChild(
            createRequest(request)
        );

    });

}


/* -------------------------
   CREATE REQUEST CARD
------------------------- */

function createRequest(request) {

    const card =
        document.createElement("article");

    card.className =
        "request-card";

    if (openedRequest === request.id) {

        card.classList.add("open");

    }


    const header =
        document.createElement("button");

    header.className =
        "request-header";

    header.type = "button";


    header.innerHTML =

        '<span class="request-code">' +
            escapeHtml(
                request.request_code || "No code"
            ) +
        '</span>' +

        '<span class="request-name">' +
            escapeHtml(
                request.name || "Unknown"
            ) +
        '</span>' +

        '<span class="status">' +
            escapeHtml(
                request.status || "Pending"
            ) +
        '</span>' +

        '<span class="request-date">' +
            formatDate(request.created_at) +
        '</span>' +

        '<span class="arrow">⌄</span>';


    header.addEventListener(
        "click",
        function() {

            if (openedRequest === request.id) {

                openedRequest = null;

            } else {

                openedRequest = request.id;

            }

            renderRequests();

        }
    );


    const details =
        document.createElement("div");

    details.className =
        "request-details";


    const inner =
        document.createElement("div");

    inner.className =
        "request-details-inner";


    const content =
        document.createElement("div");

    content.className =
        "request-content";


    content.innerHTML =

        '<div class="form-grid">' +

            '<div class="field">' +
                '<label>Name</label>' +
                '<input class="edit-name">' +
            '</div>' +

            '<div class="field">' +
                '<label>Discord</label>' +
                '<input class="edit-discord">' +
            '</div>' +

            '<div class="field">' +
                '<label>Email</label>' +
                '<input class="edit-email">' +
            '</div>' +

            '<div class="field">' +
                '<label>Status</label>' +

                '<select class="edit-status">' +

                    '<option>Pending</option>' +
                    '<option>Accepted</option>' +
                    '<option>In Progress</option>' +
                    '<option>Completed</option>' +
                    '<option>Cancelled</option>' +

                '</select>' +

            '</div>' +

            '<div class="field full">' +

                '<label>Request description</label>' +

                '<textarea class="edit-description"></textarea>' +

```
        '</div>' +

    '</div>' +

    '<div class="save-row">' +

        '<button class="primary save-button">' +
            'Save Changes' +
        '</button>' +

    '</div>' +

    '<div class="divider"></div>' +

    '<h3>Customer Files</h3>' +

    '<div class="files customer-files">' +
        '<span class="empty">Loading...</span>' +
    '</div>' +

    '<div class="divider"></div>' +

    '<h3>Updates</h3>' +

    '<div class="updates update-list">' +
        '<span class="empty">Loading...</span>' +
    '</div>' +

    '<div class="new-update">' +

        '<textarea ' +
            'class="new-message" ' +
            'placeholder="Write an update for the customer..."' +
        '></textarea>' +

        '<div class="update-actions">' +

            '<label class="file-picker">' +

                '📎 Add files' +

                '<input ' +
                    'class="new-files" ' +
                    'type="file" ' +
                    'multiple' +
                '>' +

            '</label>' +

            '<button class="primary post-update">' +
                'Post Update' +
            '</button>' +

        '</div>' +

    '</div>';


content.querySelector(".edit-name").value =
    request.name || "";

content.querySelector(".edit-discord").value =
    request.discord || "";

content.querySelector(".edit-email").value =
    request.email || "";

content.querySelector(".edit-description").value =
    request.description || "";

content.querySelector(".edit-status").value =
    request.status || "Pending";


content
    .querySelector(".save-button")
    .addEventListener(
        "click",
        function() {

            saveRequest(
                request.id,
                content
            );

        }
    );


content
    .querySelector(".post-update")
    .addEventListener(
        "click",
        function() {

            postUpdate(
                request.id,
                content
            );

        }
    );


inner.appendChild(content);
details.appendChild(inner);

card.appendChild(header);
card.appendChild(details);


if (openedRequest === request.id) {

    loadCustomerFiles(
        request.id,
        content.querySelector(".customer-files")
    );

    loadUpdates(
        request.id,
        content.querySelector(".update-list")
    );

}


return card;
```

}

/* -------------------------
SAVE REQUEST
------------------------- */

async function saveRequest(
id,
content
) {

```
const update = {

    name:
        content
            .querySelector(".edit-name")
            .value
            .trim(),

    discord:
        content
            .querySelector(".edit-discord")
            .value
            .trim(),

    email:
        content
            .querySelector(".edit-email")
            .value
            .trim(),

    description:
        content
            .querySelector(".edit-description")
            .value,

    status:
        content
            .querySelector(".edit-status")
            .value

};


const result =
    await db
        .from("requests")
        .update(update)
        .eq("id", id);


if (result.error) {

    console.error(result.error);

    toast(
        "Could not save request."
    );

    return;

}


const request =
    requests.find(function(item) {

        return item.id === id;

    });


if (request) {

    Object.assign(
        request,
        update
    );

}


renderRequests();

toast("Request saved.");
```

}

/* -------------------------
CUSTOMER FILES
------------------------- */

async function loadCustomerFiles(
requestId,
container
) {

```
const result =
    await db
        .from("request_images")
        .select("*")
        .eq("request_id", requestId);


container.innerHTML = "";


if (result.error) {

    container.innerHTML =
        '<span class="empty">Could not load files.</span>';

    return;

}


if (!result.data.length) {

    container.innerHTML =
        '<span class="empty">No files attached.</span>';

    return;

}


result.data.forEach(function(file) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "file";


    const link =
        document.createElement("a");

    link.href =
        file.image_url;

    link.target =
        "_blank";

    link.rel =
        "noopener";

    link.textContent =
        "📎 View file";


    wrapper.appendChild(link);

    container.appendChild(wrapper);

});
```

}

/* -------------------------
LOAD UPDATES
------------------------- */

async function loadUpdates(
requestId,
container
) {

```
const result =
    await db
        .from("request_updates")
        .select("*")
        .eq("request_id", requestId)
        .order("created_at", {
            ascending: true
        });


container.innerHTML = "";


if (result.error) {

    console.error(result.error);

    container.innerHTML =
        '<span class="empty">Could not load updates.</span>';

    return;

}


if (!result.data.length) {

    container.innerHTML =
        '<span class="empty">No updates yet.</span>';

    return;

}


for (const update of result.data) {

    const element =
        document.createElement("div");

    element.className =
        "update";


    let files = [];


    const fileResult =
        await db
            .from("request_update_files")
            .select("*")
            .eq("update_id", update.id);


    if (!fileResult.error) {

        files =
            fileResult.data || [];

    }


    let fileHTML = "";


    if (files.length) {

        fileHTML =
            '<div class="update-files">' +

            files.map(function(file) {

                return (
                    '<a href="' +
                    escapeAttribute(file.file_url) +
                    '" target="_blank" rel="noopener">' +
                    '📎 ' +
                    escapeHtml(file.file_name) +
                    '</a>'
                );

            }).join("") +

            '</div>';

    }


    element.innerHTML =

        '<div class="update-top">' +

            '<span class="update-author">' +
                escapeHtml(
                    update.author || "Kxko"
                ) +
            '</span>' +

            '<span class="update-date">' +
                formatDateTime(
                    update.created_at
                ) +
            '</span>' +

        '</div>' +

        '<div class="update-message">' +
            escapeHtml(
                update.message || ""
            ) +
        '</div>' +

        fileHTML;


    container.appendChild(element);

}
```

}

/* -------------------------
POST UPDATE
------------------------- */

async function postUpdate(
requestId,
content
) {

```
const message =
    content
        .querySelector(".new-message")
        .value
        .trim();

const input =
    content.querySelector(".new-files");

const files =
    Array.from(input.files);


if (!message && !files.length) {

    toast(
        "Write an update or add a file."
    );

    return;

}


const button =
    content.querySelector(".post-update");

button.disabled = true;
button.textContent = "Posting...";


const result =
    await db
        .from("request_updates")
        .insert({

            request_id: requestId,

            message:
                message || "Files attached.",

            author: "Kxko"

        })
        .select()
        .single();


if (result.error) {

    console.error(result.error);

    toast(
        "Could not create update."
    );

    button.disabled = false;
    button.textContent = "Post Update";

    return;

}


const update =
    result.data;


for (const file of files) {

function formatDate(value) {

```
if (!value) {
    return "—";
}

return new Date(value)
    .toLocaleDateString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );
```

}

function formatDateTime(value) {

```
if (!value) {
    return "—";
}

return new Date(value)
    .toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
```

}

function escapeHtml(value) {

```
return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
```

}

function escapeAttribute(value) {

```
return escapeHtml(value);
```

}

function toast(message) {

    const element =
        document.getElementById("toast");

    element.textContent =
        message;

    element.classList.add("show");

    setTimeout(function() {

        element.classList.remove("show");

    }, 3000);

}
