<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kxko Admin</title>
<link rel="icon" href="../favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f7;
    color: #182126;
    font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.login-box h1 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

.primary {
    background: #306778;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: bold;
}

.login-box .primary {
    width: 100%;
    margin-top: 12px;
}

#error {
    color: #b42318;
    margin-top: 12px;
}

/* HEADER */

header {
    background: white;
    border-bottom: 1px solid #dfe5e7;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 15px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header-inner h1 {
    margin: 0;
    font-size: 20px;
}

.logout {
    border: 1px solid #d5dcdf;
    background: white;
    border-radius: 8px;
    padding: 9px 13px;
}

/* MAIN */

main {
    max-width: 1200px;
    margin: auto;
    padding: 30px 22px 80px;
}

.top {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
}

.top h2 {
    margin: 0;
    font-size: 30px;
}

.top p {
    margin: 5px 0 0;
    color: #748087;
}

.controls {
    display: flex;
    gap: 8px;
}

.controls input,
.controls select {
    padding: 10px;
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
}

/* EXAMPLES */

.example-editor {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
}

#example-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.example {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 12px;
    overflow: hidden;
}

.example img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: #f2f4f5;
    display: block;
}

.example-content {
    padding: 16px;
}

.example h3 {
    margin: 0 0 7px;
}

.example p {
    color: #68747b;
    line-height: 1.5;
    margin: 0 0 15px;
}

.example-actions {
    display: flex;
    justify-content: flex-end;
}

.delete-example {
    border: 1px solid #d5dcdf;
    background: white;
    color: #b42318;
    border-radius: 8px;
    padding: 9px 13px;
}

/* REQUEST LIST */

#requests {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.request {
    background: white;
    border: 1px solid #dfe5e7;
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.25s ease;
}

.request.open {
    box-shadow: 0 12px 35px rgba(0,0,0,0.08);
}

.request-head {
    width: 100%;
    border: 0;
    background: white;
    padding: 17px;
    display: grid;
    grid-template-columns: 1.2fr 1fr 150px 20px;
    gap: 15px;
    align-items: center;
    text-align: left;
}

.request-head:hover {
    background: #fafbfb;
}

.code {
    font-weight: bold;
}

.name {
    color: #68747b;
}

.status {
    color: #306778;
    font-weight: bold;
    font-size: 13px;
}

.arrow {
    transition: transform 0.3s ease;
}

.request.open .arrow {
    transform: rotate(180deg);
}

/* SMOOTH EXPANSION */

.details {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s ease;
}

.request.open .details {
    grid-template-rows: 1fr;
}

.details-inner {
    overflow: hidden;
    min-height: 0;
}

.content {
    padding: 24px;
    border-top: 1px solid #e4e8ea;
}

/* FORM */

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font-size: 12px;
    color: #748087;
    font-weight: bold;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    background: white;
}

.field textarea {
    min-height: 140px;
    resize: vertical;
}

.save-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
}

.divider {
    height: 1px;
    background: #e3e7e9;
    margin: 26px 0;
}

/* FILES */

.file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file {
    background: #f0f3f4;
    padding: 9px 12px;
    border-radius: 8px;
}

.file a {
    color: #306778;
    text-decoration: none;
}

/* UPDATES */

.update {
    background: #f2f5f6;
    padding: 14px;
    border-radius: 9px;
    margin-top: 9px;
}

.update-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}

.author {
    font-weight: bold;
}

.date {
    color: #7b858b;
    font-size: 12px;
}

.message {
    white-space: pre-wrap;
    line-height: 1.5;
}

.update-files {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.update-files a {
    color: #306778;
}

/* NEW UPDATE */

.new-update {
    margin-top: 14px;
}

.new-message {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    resize: vertical;
}

.update-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 9px;
}

.file-button {
    display: inline-block;
    background: white;
    border: 1px solid #d5dcdf;
    border-radius: 8px;
    padding: 10px;
}

.file-button input {
    display: none;
}

/* TOAST */

#toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    padding: 13px 17px;
    border-radius: 9px;
    background: #182126;
    color: white;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
}

#toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* MOBILE */

@media (max-width: 900px) {

    #example-list {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 750px) {

    .top {
        display: block;
    }

    .controls {
        margin-top: 15px;
        flex-direction: column;
    }

    .request-head {
        grid-template-columns: 1fr 20px;
    }

    .name,
    .status {
        display: none;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .update-actions {
        align-items: stretch;
        flex-direction: column;
    }

    #example-list {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="login">

    <div class="login-box">

        <h1>Kxko Admin</h1>

        <p>Sign in to manage requests.</p>

        <input
            id="admin-email"
            type="email"
            placeholder="Email"
        >

        <input
            id="admin-password"
            type="password"
            placeholder="Password"
        >

        <button
            id="login-button"
            class="primary"
            type="button"
        >
            Sign In
        </button>

        <div id="error"></div>

    </div>

</div>


<div id="app" class="hidden">

    <header>

        <div class="header-inner">

            <h1>Kxko Admin</h1>

            <button
                id="logout-button"
                class="logout"
                type="button"
            >
                Log out
            </button>

        </div>

    </header>


    <main>

        <!-- EXAMPLES -->

        <section id="examples-admin">

            <div class="top">

                <div>

                    <h2>Examples</h2>

                    <p>
                        Manage the diagrams shown on your website.
                    </p>

                </div>

            </div>


            <div class="example-editor">

                <div class="grid">

                    <div class="field">

                        <label>
                            Diagram title
                        </label>

                        <input
                            id="example-title"
                            placeholder="Diagram title"
                        >

                    </div>


                    <div class="field">

                        <label>
                            Image
                        </label>

                        <input
                            id="example-image"
                            type="file"
                            accept="image/*"
                        >

                    </div>


                    <div class="field full">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="example-description"
                            placeholder="Description..."
                        ></textarea>

                    </div>

                </div>


                <div class="save-row">

                    <button
                        id="add-example"
                        class="primary"
                        type="button"
                    >
                        Add Example
                    </button>

                </div>

            </div>


            <div id="example-list">

                <p>
                    Loading examples...
                </p>

            </div>

        </section>


        <div class="divider"></div>


        <!-- REQUESTS -->

        <div class="top">

            <div>

                <h2>Requests</h2>

                <p>
                    Manage customer requests, files and updates.
                </p>

            </div>

            <div class="controls">

                <input
                    id="search"
                    type="text"
                    placeholder="Search..."
                >

                <select id="filter">

                    <option value="all">
                        All statuses
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Accepted">
                        Accepted
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <div id="requests"></div>

    </main>

</div>


<div id="toast"></div>


<script src="../js/admin.js"></script>

</body>
</html>
